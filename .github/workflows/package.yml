# yaml-language-server: $schema=https://schemastore.org/github-workflow
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          cache: npm
          node-version: current
      - run: npm ci
      - run: npm run build
      - run: npm version from-git --no-git-tag-version
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: pandoc
      - run: npm run man
      - run: npm publish
      - uses: actions/setup-node@main
        with:
          registry-url: https://npm.pkg.github.com
      - run: npm init -y --scope ${{ github.repository_owner }}
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
on:
  release:
    types:
      - created
permissions:
  contents: read
  id-token: write
  packages: write
